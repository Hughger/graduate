for(i=0; i<deltaC; i++){
    readAddr0Start = startAddr+i*deltaC*jointBlockNumW;
    writeAddrStart = startAddr+i*deltaC*jointBlockNumW+1;
    for(j=0; j<jointBlockNumW; j++){
        for(k=0;k<blockNumH; k++){
            readAddr0 = readAddr0Start+j*blockNumH+k; //结果图Block当前行的右半部分数据
            readAddr1 = readAddr1Start+j*blockNumH+k; //结果图Block当前行的左半部分数据
            writeAddr = writeAddrStart+j*blockNumH+k; //结果图Block当前行的左半部分数据
        }
    }
}
