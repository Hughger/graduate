int32_t tileSize = 16;
int32_t configArray[tileSize];

void Conv2d(COUT, H, W, CIN, delta_co, delta_h, delta_w, delta_ci){
   
    int pingPong = 0;
    for (i=0;i<=tileSize;i++) {
        WRITE_CONFIG(i, i);
    }
    WRITE_CONFIG(); // 写入配置寄存器
    RELOAD_FEATUREBLOCK(); // 加载特征图Block到CLuster内部
    WRITE_APB(MacMachine, start_addr, size); // 通过APB总线写入MacMachine控制寄存器，启动一次计算  
    for (co = 0, co < COUT) {
        for (h = 0, h < H) {
            for (w = 0, w) {
                for (ci = 0) {
                    if(MACHINE_STATE_IS_DONE) {
                        ci += delta_ci
                        w += delta_w
                        h += delta_h
                        WRITE_APB(pingPong); // 乒乓寄存器更新特征图、结果图乒乓切换
                    }
                    WRITE_APB(DMA_outputSram, co, h, w, ci, configArray[DMA_outputSram]); // 通过APB总线写入outputSram DMA控制寄存器，拉起一次数据传输  ; configArray[DMA_outputSram]存储了跳地址模式
                }
            }
        }
        2D_PROCESS(); // 对外存内
        co += delta_co
    }
        
}
