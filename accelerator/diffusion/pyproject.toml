[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sd-accel"
version = "0.1.0"
description = "Stable Diffusion ResNetBlock accelerator reference tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pytest>=7.0",
]

[project.optional-dependencies]
model = [
    "torch>=2.0",
    "diffusers>=0.24",
    "safetensors>=0.4",
    "transformers>=4.35",
]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
